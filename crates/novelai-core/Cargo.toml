[package]
name = "novelai-core"
version = "1.1.0"
description = "NovelAI client shared by Cutting Room and its MCP server: token storage, free-generation limits, rate limiting, metadata import"
edition = "2021"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
base64 = "0.22"
tokio = { version = "1", features = ["time", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.9.1"
